name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockbot-frontend-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/deepakprakashpillai/stockbot-frontend:sha-${{ github.sha }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Deploy tested frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.:-]+$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          for attempt in {1..60}; do
            if output=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "frontend $RELEASE_SHA" 2>&1); then
              printf '%s\n' "$output"
              exit 0
            fi
            printf '%s\n' "$output" >&2
            if [[ "$output" != 'Another StockBOT deployment is in progress.' || "$attempt" == 60 ]]; then
              exit 1
            fi
            sleep 15
          done
